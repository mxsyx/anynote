<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AnyNote 采集</title>
    <link rel="icon" href="/icons/icon32.png" />
  </head>
  <body>
    <header>
      <span class="brand"
        ><img
          src="/icons/logo.svg"
          width="28"
          height="28"
          alt=""
        />AnyNote</span
      >
      <button
        id="open-settings"
        data-icon="settings"
        aria-label="设置"
        title="设置"
      >
        设置
      </button>
      <button id="close-settings" data-icon="back" hidden>返回采集</button>
    </header>
    <main>
      <div id="capture-page">
        <label
          >采集记录<select id="tasks">
            <option value="">尚无采集</option>
          </select></label
        >
        <section id="capture" hidden>
          <label>标题<input id="title" maxlength="240" /></label>
          <p id="source" class="source"></p>
          <label
            >Markdown<textarea id="body" spellcheck="false"></textarea>
          </label>
          <section>
            <div class="section-heading">
              <h2>媒体文件</h2>
              <button data-icon="download" id="download">下载媒体</button>
            </div>
            <ul id="media"></ul>
          </section>
          <label class="check"
            ><input
              id="allow-missing"
              type="checkbox"
            />允许保留未下载媒体的缺失说明</label
          >
          <div class="actions">
            <button data-icon="trash" id="delete-task">删除记录</button>
            <button data-icon="copy" id="copy">复制 Markdown</button
            ><button data-icon="upload" id="cloud-upload">导入云端</button
            ><button data-icon="archive" id="export" class="primary">
              导出 .anyclip
            </button>
          </div>
          <p id="capture-status" role="status" aria-live="polite"></p>
          <p class="hint">
            采集包包含已保存文件；普通 Markdown
            复制不携带附件。文件导入：桌面端“导入网页 → 采集包”。
          </p>
        </section>
      </div>
      <div id="settings-page" hidden>
        <h1>设置</h1>
        <section class="cloud">
          <h2>Cloudflare 笔记</h2>
          <div id="cloud-login">
            <p class="hint">
              桌面端先打开一本 Notebook，再进入顶部菜单“应用 →
              备份与恢复…”（macOS 为“Anynote”菜单）。在页面下方“远端备份”的
              Cloudflare 目标卡片中，点击“采集设备 → 生成一次性配对码”。
            </p>
            <p class="hint">
              尚无目标时，先点击“添加目标”并完成一次备份。“设置 →
              从云端恢复”用于恢复已有备份，不生成配对码。
            </p>
            <label
              >Worker 地址<input
                id="cloud-endpoint"
                type="url"
                placeholder="https://…workers.dev" /></label
            ><label
              >配对码<input
                id="cloud-code"
                type="password"
                autocomplete="off" /></label
            ><button data-icon="login" id="cloud-connect">配对登录</button>
          </div>
          <div id="cloud-library" hidden>
            <div class="actions">
              <button data-icon="refresh" id="cloud-refresh">刷新目录</button
              ><button data-icon="folder" id="cloud-root">选根目录</button
              ><button data-icon="logout" id="cloud-logout">退出登录</button>
            </div>
            <p id="cloud-time" class="hint"></p>
            <p id="cloud-target"></p>
            <ul id="cloud-tree"></ul>
            <h3>采集箱</h3>
            <div id="cloud-inbox"></div>
            <article id="cloud-note"></article>
          </div>
        </section>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/panel.js"></script>
  </body>
</html>
