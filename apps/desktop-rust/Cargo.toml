[package]
name = "anynote-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
media = ["dep:pdfium-render"]
ui-tests = ["gpui-kit/test-support"]

[dependencies]
tokio.workspace = true
uuid.workspace = true
anynote-core.workspace = true
anynote-storage.workspace = true
anynote-services.workspace = true
anynote-editor.workspace = true
gpui-kit = { workspace = true, features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }
serde.workspace = true
serde_json.workspace = true
interprocess.workspace = true
async-channel.workspace = true
directories.workspace = true
markdown = "=1.0.0"
unicode-segmentation = "=1.13.3"
sha2 = "=0.10.9"
image.workspace = true
resvg.workspace = true
pdfium-render = { workspace = true, optional = true }

[lints]
workspace = true
