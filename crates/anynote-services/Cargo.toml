[package]
name = "anynote-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uuid.workspace = true
anynote-core.workspace = true
anynote-storage.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
rusty-leveldb = "=4.0.1"
crc32c = "=0.6.9"
snap = "=1.1.2"
sha2 = "=0.10.9"
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
pbkdf2 = "=0.12.2"
sha1 = "=0.10.6"
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
zeroize = "=1.9.1"
tempfile = "=3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["async-secret-service", "tokio", "crypto-rust"] }
secret-service = { version = "=4.0.0", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
security-framework = "=3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
windows = { version = "=0.61.3", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[lints]
workspace = true
