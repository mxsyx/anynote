name: Native release credential preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    environment: release
    strategy:
      matrix:
        target: [mac-arm64, win-x64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/rust-release.py credentials --target ${{ matrix.target }}
        env:
          ANYNOTE_MAC_SIGN_IDENTITY: ${{ secrets.ANYNOTE_MAC_SIGN_IDENTITY }}
          ANYNOTE_MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANYNOTE_NOTARY_PROFILE: anynote.native.release
          ANYNOTE_WIN_CERT_SHA1: ${{ secrets.ANYNOTE_WIN_CERT_SHA1 }}
          ANYNOTE_WIN_TIMESTAMP_URL: ${{ vars.ANYNOTE_WIN_TIMESTAMP_URL }}
