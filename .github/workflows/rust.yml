name: Rust native validation
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      [
        "Cargo.toml",
        "Cargo.lock",
        "rust-toolchain.toml",
        "apps/desktop-rust/**",
        "crates/**",
        "tests/fixtures/rust-migration/config/**",
        "scripts/rust-config-*.mjs",
        "scripts/check-rust-workspace.py",
        "scripts/rust-regression*",
        "scripts/test-rust-regression.py",
        "scripts/test-whiteboard-webview.py",
        "scripts/excalidraw-webview/**",
        "scripts/rust-release.py",
        "scripts/test-rust-release.py",
        "scripts/rust-release-acceptance.py",
        "scripts/test-rust-release-acceptance.py",
        "scripts/test-native-payload.py",
        "scripts/release/**",
        "scripts/rust-recovery.py",
        "tests/fixtures/pdf/**",
        ".github/workflows/rust.yml",
      ]
  pull_request:
    paths:
      [
        "Cargo.toml",
        "Cargo.lock",
        "rust-toolchain.toml",
        "apps/desktop-rust/**",
        "crates/**",
        "tests/fixtures/rust-migration/config/**",
        "scripts/rust-config-*.mjs",
        "scripts/check-rust-workspace.py",
        "scripts/rust-regression*",
        "scripts/test-rust-regression.py",
        "scripts/test-whiteboard-webview.py",
        "scripts/excalidraw-webview/**",
        "scripts/rust-release.py",
        "scripts/test-rust-release.py",
        "scripts/rust-release-acceptance.py",
        "scripts/test-rust-release-acceptance.py",
        "scripts/test-native-payload.py",
        "scripts/release/**",
        "scripts/rust-recovery.py",
        "tests/fixtures/pdf/**",
        ".github/workflows/rust.yml",
      ]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xdotool imagemagick mesa-vulkan-drivers
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cargo fetch --locked
      - run: python3 scripts/check-rust-workspace.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python3 scripts/test-rust-release.py
      - run: python3 scripts/test-rust-release-acceptance.py
      - name: Native regression with explicit evidence
        run: python3 scripts/rust-regression.py --stages tests
      - name: Build real native window probe
        run: cargo build --locked --offline -p anynote-desktop
      - name: Production whiteboard system WebView
        run: python3 scripts/test-whiteboard-webview.py
      - name: Native X11 window interactions
        run: xvfb-run -a python3 scripts/rust-platform-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-native-regression-linux
          path: |
            tmp/rm31/
            tmp/rm02/
            tmp/whiteboard-session/
          if-no-files-found: error
