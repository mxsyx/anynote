name: Rust baseline
on:
  push:
    paths:
      [
        "Cargo.toml",
        "Cargo.lock",
        "rust-toolchain.toml",
        "apps/desktop-rust/**",
        "crates/**",
        "tests/fixtures/rust-migration/config/**",
        "scripts/rust-config-*.mjs",
        "scripts/check-rust-workspace.py",
        "scripts/install-pdfium.py",
        "scripts/pdf-fixtures.py",
        "scripts/rust-regression*",
        "scripts/test-rust-regression.py",
        "scripts/rust-recovery.py",
        "tests/fixtures/pdf/**",
        ".github/workflows/rust.yml",
      ]
  pull_request:
    paths:
      [
        "Cargo.toml",
        "Cargo.lock",
        "rust-toolchain.toml",
        "apps/desktop-rust/**",
        "crates/**",
        "tests/fixtures/rust-migration/config/**",
        "scripts/rust-config-*.mjs",
        "scripts/check-rust-workspace.py",
        "scripts/install-pdfium.py",
        "scripts/pdf-fixtures.py",
        "scripts/rust-regression*",
        "scripts/test-rust-regression.py",
        "scripts/rust-recovery.py",
        "tests/fixtures/pdf/**",
        ".github/workflows/rust.yml",
      ]
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      ANYNOTE_PDFIUM_DIR: ${{ github.workspace }}/tmp/pdfium
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fetch --locked
      - run: python3 scripts/check-rust-workspace.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Install pinned native PDF library
        run: python3 scripts/install-pdfium.py --output "$ANYNOTE_PDFIUM_DIR"
      - name: Native regression with explicit evidence
        run: python3 scripts/rust-regression.py --stages tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-native-regression-linux
          path: tmp/rm31/
          if-no-files-found: error
